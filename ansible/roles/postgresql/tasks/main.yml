---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Install PostgreSQL
  ansible.builtin.apt:
    name:
      - postgresql
      - postgresql-contrib
    state: present

- name: Configure PostgreSQL listen address
  ansible.builtin.lineinfile:
    path: "/etc/postgresql/{{ postgresql_version }}/main/postgresql.conf"
    regexp: "^#?listen_addresses\\s*="
    line: "listen_addresses = '{{ postgresql_listen_addresses }}'"
  notify: Restart PostgreSQL

- name: Allow Jenkins server in pg_hba.conf
  ansible.builtin.lineinfile:
    path: "/etc/postgresql/{{ postgresql_version }}/main/pg_hba.conf"
    regexp: "^host\\s+all\\s+all\\s+{{ jenkins_private_ip | regex_escape }}/32\\s+scram-sha-256$"
    line: "host all all {{ jenkins_private_ip }}/32 scram-sha-256"
    insertafter: EOF
  notify: Restart PostgreSQL

- name: Ensure PostgreSQL is running and enabled
  ansible.builtin.service:
    name: "{{ postgresql_service }}"
    state: started
    enabled: yes
